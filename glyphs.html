<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Binary Glyph Editor (Resizable Grid with Hex Edit)</title>
  <style>
    body { font-family: sans-serif; padding: 1em; }
    .control { margin-bottom: 1em; }
    table { border-collapse: collapse; margin-bottom: 1em; }
    td {
      width: 30px; height: 30px; text-align: center; vertical-align: middle;
      border: 1px solid #ccc; cursor: pointer; font-family: monospace; font-size: 16px;
    }
    #previewCanvas {
      border: 1px solid #ccc;
      image-rendering: pixelated;
    }
    textarea { width: 100%; height: 40px; font-family: monospace; }
    #errorMsg { color: red; margin-top: 0.5em; }
  </style>
</head>
<body>

  <h1>Binary Glyph Editor (Resizable Grid with Hex Edit)</h1>
  <p>Select a character to edit its bitmap, change the grid size, or edit the hex manually.</p>
  
  <div class="control">
    <label for="gridSizeSelect">Grid Size: </label>
    <select id="gridSizeSelect">
      <option value="7x4">7×4 (28 bits)</option>
      <option value="6x5">6×5 (30 bits)</option>
    </select>
  </div>
  
  <div class="control">
    <label for="charSelect">Character: </label>
    <select id="charSelect"></select>
  </div>
  
  <h2>Editor</h2>
  <div id="editor"></div>
  
  <h2>Preview</h2>
  <canvas id="previewCanvas"></canvas>
  
  <h2>Glyph Hex Data</h2>
  <textarea id="hexOutput"></textarea>
  <div id="errorMsg"></div>
  
  <script>
    // Original glyph data for characters ' ' to '~' (95 glyphs) stored as 32-bit numbers.
    // These were originally encoded in 7x4 mode.
    const glyphData = [
      0x00000000, 0x22220200, 0x55000000, 0x05F5F500, 0x27427200, // ' ', '!', '"', '#', '$'
      0x05124500, 0x34255300, 0x22000000, 0x24444420, 0x42222240, // '%', '&', ''', '(', ')'
      0x06F6F600, 0x00272000, 0x00000240, 0x00070000, 0x00000200, // '*', '+', '\\', '-', '.'
      0x11224480, 0x25555200, 0x26222700, 0x25125700, 0x61211600, // '/', '0', '1', '2', '3'
      0x33557300, 0x64611600, 0x24655200, 0x71112200, 0x25755200, // '4', '5', '6', '7', '8'
      0x25531600, 0x00200200, 0x00200640, 0x01242100, 0x00707000, // '9', ':', ';', '<', '='
      0x04212400, 0x07120200, 0x25FF5700, 0x02557D00, 0x06575E00, // '>', '?', '@', 'A', 'B'
      0x07445300, 0x07555600, 0x07565700, 0x07564400, 0x07C95700, // 'C', 'D', 'E', 'F', 'G'
      0x05575500, 0x07222700, 0x03111600, 0x05665500, 0x04445F00, // 'H', 'I', 'J', 'K', 'L'
      0x0DFF9D00, 0x0F777D00, 0x07DD5700, 0x07564600, 0x07995770, // 'M', 'N', 'O', 'P', 'Q'
      0x07565500, 0x07461E00, 0x07222200, 0x0D999600, 0x0D552200, // 'R', 'S', 'T', 'U', 'V'
      0x0DF77500, 0x0D625500, 0x05622600, 0x07125700, 0x32222230, // 'W', 'X', 'Y', 'Z', '['
      0x44222110, 0x62222260, 0x25000000, 0x00000700, 0x42200000, // '\\',']','^','_','`'
      0x0067D700, 0x44755700, 0x00788600, 0x117DD700, 0x006FC700, // 'a', 'b', 'c', 'd', 'e'
      0x32722700, 0x007DD730, 0x44755500, 0x02622700, 0x02711130, // 'f', 'g', 'h', 'i', 'j'
      0x44766500, 0x62222700, 0x00FFFF00, 0x00755D00, 0x006DD600, // 'k', 'l', 'm', 'n', 'o'
      0x00755740, 0x00799710, 0x00744600, 0x00775700, 0x02722300, // 'p', 'q', 'r', 's', 't'
      0x00555700, 0x00552200, 0x00577500, 0x00562500, 0x00552220, // 'u', 'v', 'w', 'x', 'y'
      0x00703700, 0x12242210, 0x02222220, 0x42212240, 0x005A0000  // 'z', '{', '|', '}', '~'
    ];
    
    // Build character array from ' ' (32) to '~' (126)
    const glyphChars = [];
    for (let i = 32; i <= 126; i++) {
      glyphChars.push(String.fromCharCode(i));
    }
    
    // Each glyph now stores its value and the mode in which it was last encoded.
    // Initially, all glyphs are in "7x4" mode.
    const glyphs = [];
    for (let i = 0; i < glyphChars.length; i++) {
      glyphs.push({
        char: glyphChars[i],
        value: glyphData[i],
        mode: "7x4"
      });
    }
    
    // Global grid dimensions.
    let gridRows = 7, gridCols = 4; // default: 7x4 mode
    let currentGridMode = "7x4"; // track as string
    
    let currentGlyphIndex = 0;
    
    // Returns the bit (0 or 1) at the given row and col for a specified grid width.
    function getBit(value, row, col, cols) {
      const bitIndex = 31 - (row * cols + col);
      return (value >> bitIndex) & 1;
    }
    
    // Sets the bit (row, col) to 0 or 1 in a value for a given grid width.
    function setBit(value, row, col, bit, cols) {
      const bitIndex = 31 - (row * cols + col);
      if (bit) {
        return value | (1 << bitIndex);
      } else {
        return value & ~(1 << bitIndex);
      }
    }
    
    // Converts a glyph value from one grid size to another,
    // preserving bits in the overlapping area.
    function convertGlyphValue(oldRows, oldCols, newRows, newCols, oldValue) {
      let newValue = 0;
      const commonRows = Math.min(oldRows, newRows);
      const commonCols = Math.min(oldCols, newCols);
      for (let row = 0; row < newRows; row++) {
        for (let col = 0; col < newCols; col++) {
          let bit = 0;
          if (row < oldRows && col < oldCols) {
            bit = getBit(oldValue, row, col, oldCols);
          }
          newValue = setBit(newValue, row, col, bit, newCols);
        }
      }
      return newValue;
    }
    
    // Ensure that the current glyph is in the current grid mode.
    // If not, convert it from its stored mode to the current one.
    function ensureGlyphMode(glyph) {
      if (glyph.mode !== currentGridMode) {
        let oldRows = glyph.mode === "7x4" ? 7 : 6;
        let oldCols = glyph.mode === "7x4" ? 4 : 5;
        glyph.value = convertGlyphValue(oldRows, oldCols, gridRows, gridCols, glyph.value);
        glyph.mode = currentGridMode;
      }
    }
    
    // Render the character dropdown.
    function renderCharSelect() {
      const select = document.getElementById('charSelect');
      select.innerHTML = '';
      glyphs.forEach((glyph, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = glyph.char;
        select.appendChild(opt);
      });
      select.addEventListener('change', (e) => {
        currentGlyphIndex = parseInt(e.target.value);
        const glyph = glyphs[currentGlyphIndex];
        ensureGlyphMode(glyph);
        renderEditor();
        renderPreview();
        updateHexOutput();
        clearError();
      });
    }
    
    // Render the grid editor.
    function renderEditor() {
      const editorDiv = document.getElementById('editor');
      editorDiv.innerHTML = '';
      const table = document.createElement('table');
      const glyph = glyphs[currentGlyphIndex];
      ensureGlyphMode(glyph);
      for (let row = 0; row < gridRows; row++) {
        const tr = document.createElement('tr');
        for (let col = 0; col < gridCols; col++) {
          const td = document.createElement('td');
          const bit = getBit(glyph.value, row, col, gridCols);
          td.textContent = bit;
          td.style.backgroundColor = bit ? 'white' : 'black';
          td.style.color = bit ? 'black' : 'white';
          td.addEventListener('click', () => {
            const newBit = getBit(glyph.value, row, col, gridCols) ? 0 : 1;
            glyph.value = setBit(glyph.value, row, col, newBit, gridCols);
            td.textContent = newBit;
            td.style.backgroundColor = newBit ? 'white' : 'black';
            td.style.color = newBit ? 'black' : 'white';
            renderPreview();
            updateHexOutput();
            clearError();
          });
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
      editorDiv.appendChild(table);
    }
    
    // Render the glyph preview on the canvas.
    function renderPreview() {
      const canvas = document.getElementById('previewCanvas');
      const scale = 10;
      canvas.width = gridCols * scale;
      canvas.height = gridRows * scale;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const glyph = glyphs[currentGlyphIndex];
      ensureGlyphMode(glyph);
      for (let row = 0; row < gridRows; row++) {
        for (let col = 0; col < gridCols; col++) {
          const bit = getBit(glyph.value, row, col, gridCols);
          ctx.fillStyle = bit ? 'white' : 'black';
          ctx.fillRect(col * scale, row * scale, scale, scale);
        }
      }
    }
    
    // Update the hex output text area (using unsigned conversion).
    function updateHexOutput() {
      const glyph = glyphs[currentGlyphIndex];
      document.getElementById('hexOutput').value =
        "0x" + ((glyph.value >>> 0).toString(16).toUpperCase().padStart(8, "0"));
    }
    
    // Display an error message in the error message area.
    function displayError(message) {
      document.getElementById('errorMsg').textContent = message;
    }
    
    // Clear any error message.
    function clearError() {
      document.getElementById('errorMsg').textContent = "";
    }
    
    // When the hex area is manually edited, update the glyph value immediately.
    function initHexEdit() {
      const hexArea = document.getElementById('hexOutput');
      hexArea.addEventListener('input', () => {
        let val = hexArea.value.trim();
        if (val.startsWith("0x") || val.startsWith("0X")) {
          val = val.slice(2);
        }
        // Remove leading zeros to get the normalized hex string.
        const normalizedHex = val.replace(/^0+/, "") || "0";
        if (normalizedHex.length > 8) {
          displayError("Error: Value exceeds 32-bit limit");
          return;
        }
        // Ensure the normalized hex contains only valid hexadecimal characters.
        if (!/^[0-9A-Fa-f]+$/.test(normalizedHex)) {
          displayError("Invalid hex value");
          return;
        }
        const parsed = parseInt(val, 16);
        if (isNaN(parsed)) {
          displayError("Invalid hex value");
          return;
        }
        if (parsed > 0xFFFFFFFF) {
          displayError("Error: Value exceeds 32-bit limit");
          return;
        }
        clearError();
        const glyph = glyphs[currentGlyphIndex];
        glyph.value = parsed;
        glyph.mode = currentGridMode;
        renderEditor();
        renderPreview();
      });
    }
    
    // Listen for grid size changes.
    function initGridSizeSelector() {
      const select = document.getElementById('gridSizeSelect');
      select.addEventListener('change', (e) => {
        const value = e.target.value;
        let newRows, newCols;
        if (value === "7x4") {
          newRows = 7;
          newCols = 4;
        } else if (value === "6x5") {
          newRows = 6;
          newCols = 5;
        }
        gridRows = newRows;
        gridCols = newCols;
        currentGridMode = value;
        const glyph = glyphs[currentGlyphIndex];
        let oldRows = glyph.mode === "7x4" ? 7 : 6;
        let oldCols = glyph.mode === "7x4" ? 4 : 5;
        glyph.value = convertGlyphValue(oldRows, oldCols, gridRows, gridCols, glyph.value);
        glyph.mode = currentGridMode;
        renderEditor();
        renderPreview();
        updateHexOutput();
        clearError();
      });
    }
    
    // Initialize the UI.
    renderCharSelect();
    initGridSizeSelector();
    initHexEdit();
    renderEditor();
    renderPreview();
    updateHexOutput();
  </script>
  
</body>
</html>
